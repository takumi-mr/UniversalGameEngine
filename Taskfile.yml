version: "3"

dotenv: [".env"]

vars:
  # Overridable defaults if not in .env
  REDIS_URL: '{{.REDIS_URL | default "redis://localhost:6379"}}'
  MONGO_URL: '{{.MONGO_URL | default "mongodb://localhost:27017/game_engine"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  up:
    desc: Start infrastructure (Redis, MongoDB)
    cmds:
      - docker compose up -d

  down:
    desc: Stop infrastructure
    cmds:
      - docker compose down

  dev:
    desc: Start infrastructure and run the application in dev mode
    deps: [up, proto]
    cmds:
      - |
        # Use concurrently or separate terminals if possible, but here we run them in parallel
        # Note: In a real terminal, you might want to use something like 'concurrently'
        # For this Taskfile, we'll use bun's ability to run multiple things or just simple shell backgrounding if supported.
        # However, for Taskfile, running them sequentially with & is common in simple setups.
        - bun run --cwd=apps/backend dev & bun run --cwd=apps/frontend dev
    env:
      REDIS_URL: "{{.REDIS_URL}}"
      MONGO_URL: "{{.MONGO_URL}}"
      # Other variables from .env are automatically loaded by Task

  rl:
    desc: Run the backend in RL mode (in-memory, no Redis/MongoDB) for gRPC Reset/Step training
    env:
      RL_MODE: "true"
    cmds:
      - bun run apps/backend/server.ts

  ml:train:
    desc: Train the Othello DQN against a running RL-mode backend (see apps/ml/README.md)
    dir: apps/ml
    cmds:
      - python -m uge_rl.train --game othello --out ../../models/othello_dqn.pt {{.CLI_ARGS}}

  ml:train-shogi:
    desc: Train the Shogi DQN against a running RL-mode backend (games are cut off as draws at --max-moves)
    dir: apps/ml
    cmds:
      - python -m uge_rl.train --game shogi --max-moves 256 --eps-decay-steps 200000 --out ../../models/shogi_dqn.pt {{.CLI_ARGS}}

  ml:train-chess:
    desc: Train the Chess DQN against a running RL-mode backend (games are cut off as draws at --max-moves)
    dir: apps/ml
    cmds:
      - python -m uge_rl.train --game chess --max-moves 200 --eps-decay-steps 200000 --out ../../models/chess_dqn.pt {{.CLI_ARGS}}

  ml:train-az:
    desc: Train the Othello AlphaZero-style agent (MCTS over gRPC Simulate) against a running RL-mode backend
    dir: apps/ml
    cmds:
      - python -m uge_rl.train_az --game othello --out ../../models/othello_az.pt {{.CLI_ARGS}}

  ml:train-az-shogi:
    desc: Train the Shogi AlphaZero-style agent (MCTS over gRPC Simulate) against a running RL-mode backend
    dir: apps/ml
    cmds:
      - python -m uge_rl.train_az --game shogi --max-moves 256 --dirichlet-alpha 0.15 --out ../../models/shogi_az.pt {{.CLI_ARGS}}

  ml:train-az-chess:
    desc: Train the Chess AlphaZero-style agent (MCTS over gRPC Simulate) against a running RL-mode backend
    dir: apps/ml
    cmds:
      - python -m uge_rl.train_az --game chess --max-moves 200 --dirichlet-alpha 0.3 --out ../../models/chess_az.pt {{.CLI_ARGS}}

  ml:eval:
    desc: Evaluate a trained model vs random player (pass --checkpoint to choose the model)
    dir: apps/ml
    cmds:
      - python -m uge_rl.evaluate --checkpoint ../../models/othello_dqn.pt {{.CLI_ARGS}}

  ml:serve:
    desc: Play a trained model as the "gRPC External" opponent in real rooms (pass --checkpoint; needs a running backend, task rl for MCTS)
    dir: apps/ml
    cmds:
      - python -m uge_rl.serve --checkpoint ../../models/shogi_az.pt {{.CLI_ARGS}}

  ml:test:
    desc: Run apps/ml unit tests (no backend needed; same command as CI)
    dir: apps/ml
    cmds:
      - python -m pytest tests -q

  clean:
    desc: Stop infrastructure and remove volumes
    cmds:
      - docker compose down -v

  install:
    desc: Install dependencies
    cmds:
      - bun install

  proto:
    desc: Compile protobuf files to TypeScript
    dir: packages/shared
    cmds:
      - bun run proto:gen
