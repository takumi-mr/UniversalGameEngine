name: PR Check (Test & Lint)

# PRが作成・更新された時に実行
on:
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout code
        uses: actions/checkout@v4

      # Bun環境のセットアップ（公式アクションを使用）
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # フォーマッターのチェック
      - name: Run Prettier Check
        run: bun x prettier --check .

      # 依存関係のインストール
      - name: Install Dependencies
        run: bun install

      # Linterの実行
      - name: Run Linter
        run: bun run lint

      # 型チェック
      - name: Run Type Check
        run: bun run type-check

      # テストの実行
      - name: Run Tests
        run: bun test
