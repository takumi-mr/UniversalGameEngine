name: PR Check (Test & Lint)

# PRが作成・更新された時に実行
on:
  pull_request:
    branches:
      - main

jobs:
  # TypeScript 側: prettier / eslint / 型チェック / bun:test（shared, backend）/ vitest（frontend）
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout code
        uses: actions/checkout@v4

      # Bun環境のセットアップ（公式アクションを使用）
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 依存関係のインストール
      # ※ Prettier より先に実行し、package.json で固定したバージョンの prettier を使う
      #   （bun x が最新版を取得すると、ルール変更で既存ファイルが引っかかる）
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # フォーマッターのチェック
      - name: Run Prettier Check
        run: bun x prettier --check .

      # Linterの実行
      - name: Run Linter
        run: bun run lint

      # 型チェック（ルート tsconfig で apps/** と packages/** を tsconfig.base.json の厳しさで検査）
      - name: Run Type Check
        run: bun run type-check

      # bun:test（packages/shared, apps/backend）
      - name: Run Tests (bun)
        run: bun run test

      # vitest（apps/frontend: jsdom + @vue/test-utils）
      - name: Run Frontend Tests (vitest)
        run: bun run test:frontend

  # Python 側: apps/ml の単体テスト（gRPC サーバー不要）
  ml-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt

      # torch は CPU 版を先に入れる（既定の CUDA 版は数 GB あり CI では無駄）。
      # 後続の requirements.txt の torch>=2.3 はこれで満たされるので再ダウンロードされない。
      - name: Install Dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt pytest

      - name: Run Tests (pytest)
        run: python -m pytest tests -q

  # Docker イメージのビルド検証（起動はしない）
  # ルートの package.json / tsconfig を触ったときに Dockerfile の COPY 漏れで壊れるのを PR で検知する。
  # docker-compose.yml と同じ context / dockerfile でビルドし、イメージは push しない。
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # レイヤーキャッシュを GitHub Actions のキャッシュに保存し、依存が変わらない PR では bun install を飛ばす
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
