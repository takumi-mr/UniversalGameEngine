name: PR Check (Test & Lint)

# PRが作成・更新された時に実行
on:
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # リポジトリのコードを取得
      - name: Checkout code
        uses: actions/checkout@v4

      # Bun環境のセットアップ（公式アクションを使用）
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 依存関係のインストール
      # ※ Prettier より先に実行し、package.json で固定したバージョンの prettier を使う
      #   （bun x が最新版を取得すると、ルール変更で既存ファイルが引っかかる）
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # フォーマッターのチェック
      - name: Run Prettier Check
        run: bun x prettier --check .

      # Linterの実行
      - name: Run Linter
        run: bun run lint

      # 型チェック
      - name: Run Type Check
        run: bun run type-check

      # テストの実行
      - name: Run Tests
        run: bun test
