syntax = "proto3";

package universal_game_engine;

// 基本的なゲームアクションの表現
message GameAction {
    string type = 1;
    string payload_json = 2; // アクションの詳細データをJSON文字列として保持（汎用性のため）
}

// ゲーム状態のリクエストとレスポンス
message CreateGameRequest {
    string game_type = 1;
    string options_json = 2;
}

message CreateGameResponse {
    string game_id = 1;
}

message JoinGameRequest {
    string game_id = 1;
    bool as_spectator = 2;
    string user_token = 3;
}

message JoinSuccess {
    string assigned_player_id = 1; // "1" や "O" など
    string game_id = 2;
}

message DispatchActionRequest {
    string game_id = 1;
    GameAction action = 2;
}

message CommonResponse {
    bool success = 1;
    string message = 2;
}

// サーバーからのゲーム状態ストリーム
message GameStateUpdate {
    string state_json = 1;
    GameMetadata metadata = 2;
    // AI・強化学習用
    repeated float state_tensor = 3;      // 盤面を1次元の数値配列化したもの
    repeated int32 legal_action_ids = 4;  // 選択可能な合法手のインデックスのリスト
    map<string, float> rewards = 5;       // 各プレイヤーが得た報酬（勝敗やスコア）
    bool is_finished = 6;                 // エピソードの終了フラグ（RLの done に相当）
}

message GameMetadata {
    int32 player_count = 1;
    int32 spectator_count = 2;
    repeated string active_players = 3;
}

// チャットメッセージ
message ChatMessage {
    string user_id = 1;
    string message = 2;
    string channel = 3;
    string recipient_id = 4;
    string timestamp = 5;
    string game_id = 6;
}

message StepRequest {
    string game_id = 1;
    string player_id = 2;
    int32 action_id = 3; // AIはJSONではなく数値インデックスで手を指定
}

message StepResponse {
    // 次に行動権を持つプレイヤー（active_players[0]）視点の状態テンソルと合法手。
    // 自己対戦ループでは 1 つのクライアントが全プレイヤーを操作するため、
    // 「次に手を指す側」の観測をそのまま返す。ゲーム終了時は player_id 視点。
    repeated float next_state_tensor = 1;
    repeated int32 legal_action_ids = 2;
    // player_id（この Step で手を指したプレイヤー）視点の報酬。終局時のみ非ゼロ。
    float reward = 3;
    bool is_finished = 4;
    // この状態において行動権があるプレイヤーのID（自分以外ならAIは待機する）
    repeated string active_players = 5;
    // 次の局面の完全な状態（マスクなし）。Simulate の親局面として使う
    string state_json = 6;
}

// ゲームを初期状態にリセットする（AIの自己対戦ループ用）
// リセット後は全席にプレイヤーを着席させ、status を PLAYING にして即座に Step 可能な状態にする。
message ResetGameRequest {
    string game_id = 1;
    // 着席させるプレイヤーIDのリスト。省略時は "player_1", "player_2", ... が自動生成される。
    repeated string player_ids = 2;
}

message ResetGameResponse {
    repeated float initial_state_tensor = 1;
    repeated int32 initial_legal_action_ids = 2;
    repeated string active_players = 3;
    // 初期局面の完全な状態（マスクなし）。Simulate の親局面として使う
    string state_json = 4;
}

// 任意の局面に 1 手適用する（セッション不要・副作用なし）。
// 木探索（MCTS 等）で「この局面からこの手を指したらどうなるか」を試すために使う。
// state_json はサーバーが返した完全な状態をそのまま渡す（クライアントは中身を解釈しなくてよい）。
message SimulateRequest {
    string game_type = 1;
    string state_json = 2;
    string player_id = 3;
    int32 action_id = 4;
}

message SimulateResponse {
    string state_json = 1;               // 適用後の局面
    repeated float state_tensor = 2;     // 次に行動するプレイヤー視点（終局時は player_id 視点）
    repeated int32 legal_action_ids = 3;
    float reward = 4;                    // player_id 視点。終局時のみ非ゼロ
    bool is_finished = 5;
    repeated string active_players = 6;
    // 不正な手などで適用できなかった場合のメッセージ（空なら成功）。Batch で個別に失敗を返すために使う
    string error = 7;
}

// RPC オーバーヘッド削減用。items は互いに独立で、順序どおりに結果を返す
message BatchSimulateRequest {
    repeated SimulateRequest items = 1;
}

message BatchSimulateResponse {
    repeated SimulateResponse items = 1;
}

// 実際のプレイでAIボットがターンを待避・送信するためのリクエスト
message WaitForTurnRequest {
    string game_id = 1;
    string player_id = 2;
}

message WaitForTurnResponse {
    repeated float state_tensor = 1;
    repeated int32 legal_action_ids = 2;
    // ボット自身の視点でマスクした局面（他のプレイヤーへの配信と同じ。Secret は展開済み・prngSecret なし）。
    // 完全情報ゲームなら Simulate の親局面として渡せる（AlphaZero 風エージェントの木探索用）
    string state_json = 3;
}

message SubmitTurnRequest {
    string game_id = 1;
    string player_id = 2;
    int32 action_id = 3;
}

service GameService {
    // 単発のRPC
    rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
    rpc DispatchAction(DispatchActionRequest) returns (CommonResponse);
    rpc SendChat(ChatMessage) returns (CommonResponse);

    // サーバーからのプッシュ（gRPC-webではサーバーサイドストリーミングを常用）
    rpc StreamEvents(JoinGameRequest) returns (stream GameEvent);

    // AI学習ループ専用のエンドポイント
    rpc Step(StepRequest) returns (StepResponse);
    rpc Reset(ResetGameRequest) returns (ResetGameResponse);
    // 木探索用のステートレスなシミュレーション
    rpc Simulate(SimulateRequest) returns (SimulateResponse);
    rpc BatchSimulate(BatchSimulateRequest) returns (BatchSimulateResponse);

    // AIプレイ用のエンドポイント
    rpc WaitForTurn(WaitForTurnRequest) returns (stream WaitForTurnResponse);
    rpc SubmitTurn(SubmitTurnRequest) returns (CommonResponse);
}

message GameEvent {
    oneof event {
        JoinSuccess joined = 1;
        GameStateUpdate state_update = 2;
        ChatMessage chat_message = 3;
        string error_message = 4;
    }
}
